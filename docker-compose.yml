services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: household-command-center:latest
    restart: unless-stopped
    ports:
      - '3003:3000'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DOCKER_API_URL=http://docker-proxy:2375
    volumes:
      - ./data:/app/data
    depends_on:
      - docker-proxy
    command: ["npm", "start"]

  # Omejen, samo-bralni dostop do Dockerja za mrežni pregled.
  # Aplikacija nima neposrednega dostopa do docker.sock.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
