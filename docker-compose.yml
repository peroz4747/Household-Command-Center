version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: household-command-center:dev
    ports:
      - '3003:3000'
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app:cached
      - /app/node_modules
      - ./data:/app/data
    # Ensure Next dev binds to 0.0.0.0 so the app and source maps are reachable from LAN
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]

  # For production, run the built image with `docker-compose -f docker-compose.yml run --service-ports app`
