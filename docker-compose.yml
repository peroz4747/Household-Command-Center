version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: household-command-center:latest
    ports:
      - '3003:3000'
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    command: ["npm", "start"]

  # For production, run the built image with `docker-compose -f docker-compose.yml run --service-ports app`
