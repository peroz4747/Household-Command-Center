services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: household-command-center:latest
    restart: unless-stopped
    # Host omrežje: potrebno za Wake-on-LAN (broadcast iz bridge omrežja ne pride v domače omrežje).
    # Aplikacija zato posluša neposredno na portu 3003 LXC kontejnerja (isti naslov kot prej).
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DOCKER_API_URL=http://127.0.0.1:2375
    volumes:
      - ./data:/app/data
      # CPU temperature in systemd stanje s Proxmox hosta (zapiše jih hcc-host-status timer,
      # v CT 101 je /var/lib/hcc-host priklopljen na /srv/hcc-host). Neobvezno.
      - /srv/hcc-host:/host-status:ro
      # SSH ključ za izklop/spanje računalnika (glej docs/pc-power.md). Neobvezno.
      - ./secrets:/app/secrets:ro
    depends_on:
      - docker-proxy
    command: ["npm", "start"]

  # Omejen, samo-bralni dostop do Dockerja za mrežni pregled.
  # Aplikacija nima neposrednega dostopa do docker.sock.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    # Dostopen samo lokalno (aplikacija teče v host omrežju).
    ports:
      - '127.0.0.1:2375:2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
