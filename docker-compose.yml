services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: household-command-center:latest
    restart: unless-stopped
    ports:
      - '3003:3000'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DOCKER_API_URL=http://docker-proxy:2375
    volumes:
      - ./data:/app/data
      # CPU temperature in systemd stanje s Proxmox hosta (zapiše jih hcc-host-status timer,
      # v CT 101 je /var/lib/hcc-host priklopljen na /srv/hcc-host). Neobvezno.
      - /srv/hcc-host:/host-status:ro
      # Zahteve za varen izklop/vklop ZFS bazena tank (izvede hcc-tank-control na hostu, mp1 v CT 101).
      - /srv/hcc-control:/host-control
    depends_on:
      - docker-proxy
    command: ["npm", "start"]

  # Omejen, samo-bralni dostop do Dockerja za mrežni pregled.
  # Aplikacija nima neposrednega dostopa do docker.sock.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
